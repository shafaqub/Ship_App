name: ship_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  http: ^1.6.0
  google_sign_in: ^7.1.1
  google_sign_in_web: ^1.1.3
  purchases_flutter: ^10.13.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/interviewme-logo-v8.png
    - assets/images/InterviewMe_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/InterviewMe_logo.png"
  remove_alpha_ios: true